name: ${COMPOSE_PROJECT_NAME:-inventory-automation}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    entrypoint: ["sh", "/opt/inventory/postgres-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_bootstrap}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/entrypoint.sh:/opt/inventory/postgres-entrypoint.sh:ro
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_DB_HOST: db
      APP_DB_NAME: ${POSTGRES_DB:-inventory}
      APP_DB_USER: inventory_app
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./.local/secrets/postgres_password
  app_db_password:
    file: ./.local/secrets/app_db_password

volumes:
  postgres_data:
