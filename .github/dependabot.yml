version: 2
updates:
  # O backend usa uv como gerenciador e mantém o lockfile backend/uv.lock.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
