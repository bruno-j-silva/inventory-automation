version: 2
updates:
  # O backend usa uv como gerenciador e mantém o lockfile backend/uv.lock.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint@8.x ainda exige TypeScript <6.1.
      - dependency-name: typescript
        versions: [">=7.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
